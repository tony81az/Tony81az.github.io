<!DOCTYPE html>
<html>
<body>

<h1>Multiple div Elements</h1>

<div style="background-color:#FFF4A3;padding:8px;">
  <h2>London</h2>
  <p>London is the capital city of England.</p>
</div>

<div style="background-color:#FFC0C7;padding:8px;">
  <h2>Oslo</h2>
  <p>Oslo is the capital city of Norway.</p>
</div>

<div style="background-color:#D9EEE1;padding:8px;">
  <h2>Rome</h2>
  <p>Rome is the capital city of Italy.</p>
</div>

<p>CSS styles are added to make it easier to separate the divs.</p>

</body>
</html>
